name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          VERSION="$VERSION" Scripts/build-app.sh
      - name: Render self-test
        run: .build/release/CapturePro --render-demo "$RUNNER_TEMP/demo" || .build/*/release/CapturePro --render-demo "$RUNNER_TEMP/demo"
      - uses: actions/upload-artifact@v4
        with:
          name: CapturePro
          path: dist/*.zip
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber || gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
